<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quilt</title>
<style>
  :root { --bg: #FBF8F3; --surface: #FFFFFF; --ink: #39352E; --muted: #6F695E; --line: #E6DFD3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1C1A17; --surface: #242118; --ink: #EDE7DC; --muted: #A79F92; --line: #3A342C; }
  }
  * { box-sizing: border-box; }
  /* Sin esto, el display de .stores y .stores a gana al atributo hidden. */
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 420px; width: 100%; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .stores { display: flex; flex-direction: column; gap: 10px; }
  .stores a {
    display: block; text-align: center; padding: 14px; border-radius: 26px; text-decoration: none;
    font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  }
  .home { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="text"></p>
  <div class="stores" id="stores" hidden>
    <a id="play" href="https://play.google.com/store/apps/details?id=com.baltajmn.habit">Google Play</a>
    <a id="apple" href="https://apps.apple.com/app/id6819302953">App Store</a>
  </div>
</main>
<script>
  // GitHub Pages sirve esta pagina para cualquier ruta que no conoce, asi que es tambien la de los
  // enlaces de un habito compartido (/h/<codigo>): con la app instalada el enlace no llega aqui, abre la
  // app. Sin ella, cada movil va a su tienda: Play en Android, la App Store en iPhone y iPad. En un
  // ordenador salen las dos.
  var PLAY = "https://play.google.com/store/apps/details?id=com.baltajmn.habit";
  var APPLE = "https://apps.apple.com/app/id6819302953";
  var T = {
    en: ["Do a habit together on Quilt", "Install Quilt, then open this link again.", "This page does not exist."],
    es: ["Haced un hábito juntos en Quilt", "Instala Quilt y vuelve a abrir este enlace.", "Esta página no existe."],
    pt: ["Façam um hábito juntos no Quilt", "Instale o Quilt e abra este link de novo.", "Esta página não existe."],
    de: ["Eine Gewohnheit gemeinsam mit Quilt", "Installiere Quilt und öffne diesen Link dann noch einmal.", "Diese Seite gibt es nicht."],
    fr: ["Une habitude à deux avec Quilt", "Installe Quilt, puis rouvre ce lien.", "Cette page n'existe pas."]
  };
  var lang = (navigator.language || "en").slice(0, 2);
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : "en";
  var link = /^\/h\/[0-9a-fA-F]{10}\/?$/.test(location.pathname);
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  // iPadOS pide el sitio de escritorio: se hace pasar por un Mac, pero con pantalla tactil.
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  function show(title, text, play, apple) {
    document.getElementById("title").textContent = title;
    document.getElementById("text").innerHTML = text;
    document.getElementById("play").hidden = !play;
    document.getElementById("apple").hidden = !apple;
    document.getElementById("stores").hidden = !(play || apple);
  }

  if (!link) {
    show(t[2], '<a class="home" href="/">quilt.baltajmn.dev</a>', false, false);
  } else if (android) {
    show(t[0], t[1], true, false);
    location.replace(PLAY);
  } else if (ios) {
    show(t[0], t[1], false, true);
    location.replace(APPLE);
  } else {
    show(t[0], t[1], true, true);
  }
</script>
</body>
</html>
